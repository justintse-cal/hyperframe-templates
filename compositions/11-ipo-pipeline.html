        const tl = gsap.timeline({ paused: true });

        // 0–2s: Pipeline name
        tl.fromTo(".pipeline-title",

          { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" },

          { opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" },
          2.0

        // 5–8s: Data packet moves to Process block
        tl.fromTo("#c11-packet",
          { opacity: 0, x: 0 },
          { opacity: 1, x: 180, duration: 1.5, ease: "power2.inOut" },
          5.0
        );
        tl.fromTo("#c11-process",
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" },
          5.8
        );

        // 8–11s: Data packet moves to Output block
        tl.to("#c11-packet",
          { x: 380, duration: 1.5, ease: "power2.inOut" },
          8.0
        );
        tl.fromTo("#c11-output",
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" },
          8.8
        );

        // 11–12s: Seal loop
        tl.to(".ipo-block",
          { borderColor: "#FFF3A8", duration: 0.8 },
          11.0
