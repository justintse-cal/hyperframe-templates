<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          background: linear-gradient(135deg, #FFFCEF 0%, #FDF3F8 100%);
          color: #121212;
          font-family: 'Inter', sans-serif;
          overflow: hidden;
          box-sizing: border-box;
        }

        .frame-border {
          position: absolute;
          inset: 32px;
          border: 1px solid rgba(18, 18, 18, 0.18);
          pointer-events: none;
          z-index: 20;
        }

        .map-title {
          position: absolute;
          top: 140px;
          left: 96px;
          right: 96px;
          text-align: center;
          font-family: 'Playfair Display', serif;
          font-size: 50px;
          font-weight: 800;
          color: #8A6D00;
        }

        /* Network Map Stage */
        .network-stage {
          position: absolute;
          inset: 220px 140px 120px 140px;
        }

        /* SVG Lines */
        svg.network-svg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }

        line.node-link {
          stroke: rgba(18, 18, 18, 0.35);
          stroke-width: 2;
          stroke-dasharray: 400;
          stroke-dashoffset: 400;
        }

        /* Nodes */
        .node-hub {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 120px;
          height: 120px;
          border-radius: 50%;
          background: #FFF3A8;
          border: 3px solid #8A6D00;
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          font-family: 'Playfair Display', serif;
          font-size: 21px;
          font-weight: 800;
          color: #121212;
          box-shadow: 0 0 30px rgba(138, 109, 0, 0.15);
          opacity: 0;
          z-index: 10;
        }

        .peripheral-node {
          position: absolute;
          background: linear-gradient(135deg, #FFFCEF 0%, #FDF3F8 100%);
          border: 2px solid #C2185B;
          border-radius: 20px;
          padding: 10px 20px;
          font-size: 17px;
          font-weight: 700;
          color: #121212;
          opacity: 0;
          z-index: 5;
        }

        .pn-1 { top: 40px; left: 336px; }
        .pn-2 { top: 40px; right: 336px; }
        .pn-3 { bottom: 60px; left: 336px; }
        .pn-4 { bottom: 60px; right: 336px; }

      </style>

      <div data-hf-id="hf-31cx" id="root" data-composition-id="C04-network-node-map" data-width="1920" data-height="1080" data-duration="15">
        <div data-hf-id="hf-ev3u" class="frame-border"></div>

        <div data-hf-id="hf-rbf4" class="map-title">Global Supply Chain Network</div>

        <div data-hf-id="hf-9sgb" class="network-stage">
          <svg data-hf-id="hf-cius" class="network-svg" viewBox="0 0 880 540">
            <line data-hf-id="hf-xcbv" id="c15-l1" class="node-link" x1="440" y1="270" x2="160" y2="80" />
            <line data-hf-id="hf-bzxg" id="c15-l2" class="node-link" x1="440" y1="270" x2="720" y2="80" />
            <line data-hf-id="hf-ladx" id="c15-l3" class="node-link" x1="440" y1="270" x2="160" y2="460" />
            <line data-hf-id="hf-hp28" id="c15-l4" class="node-link" x1="440" y1="270" x2="720" y2="460" />
          </svg>

          <div data-hf-id="hf-xwx3" class="node-hub" id="c15-hub">HQ HUB</div>

          <div data-hf-id="hf-mukv" class="peripheral-node pn-1" id="c15-pn1">Node 01: Supplier</div>
          <div data-hf-id="hf-c1xz" class="peripheral-node pn-2" id="c15-pn2">Node 02: Logistics</div>
          <div data-hf-id="hf-2oxm" class="peripheral-node pn-3" id="c15-pn3">Node 03: Retail</div>
          <div data-hf-id="hf-8kj2" class="peripheral-node pn-4" id="c15-pn4">Node 04: Customer</div>
        </div>

      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // 0–2s: Central hub node
        tl.fromTo("#c15-hub",
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 1.2, ease: "back.out(1.7)" },
          0
        );

        // 2–8s: Radiate lines outward to 4 peripheral nodes
        tl.to([ "#c15-l1", "#c15-l2", "#c15-l3", "#c15-l4" ],
          { strokeDashoffset: 0, duration: 2.5, ease: "power2.inOut" },
          2.0
        );

        tl.fromTo("#c15-pn1", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6 }, 3.0);
        tl.fromTo("#c15-pn2", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6 }, 4.2);
        tl.fromTo("#c15-pn3", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6 }, 5.4);
        tl.fromTo("#c15-pn4", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6 }, 6.6);

        // 8–12s: Pulse hub
        tl.fromTo("#c15-hub",
          { boxShadow: "0 0 30px rgba(138, 109, 0, 0.15)" },
          { boxShadow: "0 0 60px rgba(194, 24, 91, 0.35)", duration: 1.0, yoyo: true, repeat: 1 },
          8.0
        );

        window.__timelines["C04-network-node-map"] = tl;
      </script>
    </template>
  </body>
</html>
