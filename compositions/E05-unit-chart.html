      <script>
        const tl = gsap.timeline({ paused: true });

        // 0.4–1.4s: 78 of the 100 dots light up one by one in a scattered,
        // but fully deterministic, order (multiplicative permutation — no randomness).
        // pos(i) = (i * 73) % 100 inverts order = (pos * 37) % 100 (73 is 37^-1 mod 100),
        // so each dot knows its own lighting time without a shared baseline.
        const dots = Array.from(document.querySelectorAll("#e5-grid .unit-dot"));
        const LIT_COUNT = 78;
        const STEP = 1 / LIT_COUNT; // all 78 light up across ~1s
        const litDelay = (target) => {
          const i = dots.indexOf(target);
          return 0.4 + ((i * 73) % 100) * STEP;
        };
        const litDots = dots.filter((_, i) => ((i * 73) % 100) < LIT_COUNT);

        // stay lit once lit (to() tweens start from the gray CSS baseline)
        tl.to(litDots, {
          backgroundColor: "#C2185B",
          duration: 0.18,
          ease: "power2.out",
          stagger: (index, target) => litDelay(target)
        }, 0);

        // small pop as each dot lights
        tl.to(litDots, {
          scale: 1.3,
          duration: 0.09,
          yoyo: true,
          repeat: 1,
          ease: "power2.out",
          stagger: (index, target) => litDelay(target)
        }, 0);

        // 1.6–2.8s: the chart reorganizes — the 78 lit dots pack into the
        // top-left cells 0–77 (DOM order) and the 22 unlit dots get pushed
        // into the bottom-right cells 78–99. Pure transforms: grid pitch is
        // 28px dot + 14px gap = 42px, so each dot's move is
        // (dest − src) × 42 on x/y. Bijection over all 100 cells → no overlap.
        const PITCH = 42;
        const destOf = new Map();
        let litFill = 0;
        let unlitFill = 0;
        dots.forEach((dot, i) => {
          const pos = (i * 73) % 100;
          destOf.set(dot, pos < LIT_COUNT ? litFill++ : LIT_COUNT + unlitFill++);
        });
        const colOf = (n) => n % 10;
        const rowOf = (n) => Math.floor(n / 10);

        tl.to(dots, {
          x: (index, target) => (colOf(destOf.get(target)) - colOf(index)) * PITCH,
          y: (index, target) => (rowOf(destOf.get(target)) - rowOf(index)) * PITCH,
          duration: 0.8,
          ease: "power3.inOut",
          // sweep column by column toward each dot's destination cell
          stagger: (index, target) =>
            colOf(destOf.get(target)) * 0.045 + rowOf(destOf.get(target)) * 0.02
        }, 1.6);

        // 0.9–1.9s: statement slides in from the right
        tl.fromTo("#e5-text",
          { opacity: 0, x: 90 },
          { opacity: 1, x: 0, duration: 1, ease: "power3.out" },
          0.9
        );

        // No exit animation — holds until the clip ends at 8s

        window.__timelines["E05-unit-chart"] = tl;
      </script>
