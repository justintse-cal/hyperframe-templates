        #root {

          border: 1px solid rgba(18, 18, 18, 0.18);
          pointer-events: none;
          z-index: 20;
        }

        .news-banner {
          position: absolute;
          top: 140px;

          font-family: 'Playfair Display', serif;
          font-size: 66px;
          font-weight: 800;

        .word-unit {
          display: inline-block;

        .ticker-bar {

          font-family: 'Inter', sans-serif;

          font-weight: 700;

      <div data-hf-id="hf-12n2" id="root" data-composition-id="D01-breaking-news" data-width="1920" data-height="1080" data-duration="8">

      <script>
        const tl = gsap.timeline({ paused: true });

        // 0–0.6s: Flash category tag banner
        tl.fromTo("#c16-banner",

        tl.fromTo("#c16-ticker",
