<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap');

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          background: #ffffff;
          color: #000000;
          font-family: "Noto Sans", sans-serif;
          overflow: hidden;
          box-sizing: border-box;
        }

        .frame-border {
          position: absolute;
          inset: 32px;
          border: 1px solid rgba(18, 18, 18, 0.18);
          pointer-events: none;
          z-index: 20;
        }

        /* Stage Containers */
        .stage-box {
          position: absolute;
          top: 180px;
          left: 112px;
          right: 112px;
          bottom: 160px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 40px;
          box-sizing: border-box;
          border-radius: 12px;
        }

        /* Problem Stage (Stark Coral Warning) */
        /* White cover panel: the problem stage holds underneath while this wipes
           in over it, so the hand-off is two entrances and no exit (§5). */
        .stage-cover {
          position: absolute;
          inset: 0;
          background: #ffffff;
          opacity: 0;
          z-index: 10;
        }

        .problem-stage {
          /* Yellow-theme tint only (§3). */
          background: rgba(255, 165, 0, 0.08);
          border: 2px solid #ffcf00;
          opacity: 0;
        }

        .problem-tag {
          font-family: "Noto Sans", sans-serif;
          font-size: 26px;
          font-style: italic;
          color: #ffcf00;
          margin-bottom: 20px;
          text-transform: uppercase;
          letter-spacing: 0.1em;
        }

        .problem-title {
          font-family: "Noto Sans", sans-serif;
          font-size: 50px;
          font-weight: 800;
          color: #000000;
          line-height: 1.25;
          max-width: 1100px;
        }

        .crack-barrier {
          width: 240px;
          height: 4px;
          background: #ffcf00;
          margin-top: 32px;
          opacity: 0;
          box-shadow: 0 0 15px rgba(192, 57, 43, 0.45);
        }

        /* Solution Stage (Vibrant Brand Yellow & Pink) */
        .solution-stage {
          background: rgba(255, 207, 0, 0.1);
          border: 2px solid #ffcf00;
          box-shadow: 0 0 40px rgba(255, 207, 0, 0.35);
          opacity: 0;
        }

        .solution-tag {
          font-family: "Noto Sans", sans-serif;
          font-size: 26px;
          font-style: italic;
          color: #ffa500;
          margin-bottom: 20px;
          text-transform: uppercase;
          letter-spacing: 0.1em;
        }

        .solution-title {
          font-family: "Noto Sans", sans-serif;
          font-size: 50px;
          font-weight: 800;
          color: #ffcf00;
          line-height: 1.25;
          max-width: 1100px;
        }

      </style>

      <div data-hf-id="hf-edhj" id="root" data-composition-id="problem-solution" data-width="1920" data-height="1080" data-duration="8">
        <div data-hf-id="hf-ev3u" class="frame-border"></div>

        <!-- Stage 1: Problem -->
        <div data-hf-id="hf-m1dv" class="stage-box problem-stage" id="c4-problem">
          <div data-hf-id="hf-hs8h" class="problem-tag">The Pain Point</div>
          <div data-hf-id="hf-pawi" class="problem-title">Legacy systems stall growth and burn engineering hours.</div>
          <div data-hf-id="hf-5r3x" class="crack-barrier" id="c4-barrier"></div>
        </div>

        <div data-hf-id="hf-c4cover" class="stage-cover" id="c4-cover"></div>

        <!-- Stage 2: Solution -->
        <div data-hf-id="hf-jbnn" class="stage-box solution-stage" id="c4-solution">
          <div data-hf-id="hf-9jd5" class="solution-tag">The Resolution</div>
          <div style="color: rgb(0, 0, 0)" data-hf-id="hf-mc40" class="solution-title">Automated pipelines scale effortlessly with instant rollback.</div>
        </div>

      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // 0–0.8s: Flash problem statement in stark warning palette
        tl.fromTo("#c4-problem",
          { opacity: 0, scale: 0.92 },
          { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" },
          0
        );

        // 1.4–2.4s: Hold problem steady while graphical barrier appears
        tl.fromTo("#c4-barrier",
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 1.0, ease: "power2.out" },
          1.4
        );

        // 3.4–5s: cover the problem stage, then reveal the solution.
        // Both beats are entrances; #c4-problem keeps its final state (§5).
        tl.fromTo("#c4-cover",
          { opacity: 0 },
          { opacity: 1, duration: 0.6, ease: "power2.inOut" },
          3.4
        );
        // Hidden instantly behind the cover, never animated out (§5).
        tl.set("#c4-problem", { autoAlpha: 0 }, 4.0);
        tl.fromTo("#c4-solution",
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
          4.0
        );

        // 5–8s: settle final lockup
        window.__timelines["problem-solution"] = tl;
      </script>
    </template>
  </body>
</html>
