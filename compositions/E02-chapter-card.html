        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          background: linear-gradient(135deg, #FFFCEF 0%, #FDF3F8 100%);
          color: #121212;
          font-family: 'Inter', sans-serif;
          overflow: hidden;
          box-sizing: border-box;
        }

        .bg-clip {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
        }

        .dim-overlay {
          position: absolute;
          inset: 0;
          background: rgba(0, 0, 0, 0.5);
        }

        .chapter-center {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
        }

        .chapter-label {
          font-family: 'Inter', sans-serif;
          font-size: 23px;
          font-weight: 700;
          letter-spacing: 0.34em;
          text-transform: uppercase;
          color: #FFF3A8;
          margin-bottom: 36px;
          opacity: 0;
          /* sits slightly above the visual center */
          transform: translateY(-40px);
        }

        .chapter-title {
          font-family: 'Playfair Display', serif;
          font-size: 92px;
          font-weight: 800;
          line-height: 1.18;
          color: #ffffff;
          max-width: 1500px;
        }

        .chapter-title .word {
          display: inline-block;
          white-space: nowrap;
        }

        .chapter-title .char {
          display: inline-block;
          opacity: 0;
        }

        /* Editorial chrome on top of the clip */
        .frame-border {
          position: absolute;
          inset: 32px;
          border: 1px solid rgba(255, 255, 255, 0.35);
          pointer-events: none;
          z-index: 20;
        }

        .frame-border::before {
          content: '';
          position: absolute;
          inset: 6px;
          border: 1px dashed rgba(255, 243, 168, 0.4);
        }
