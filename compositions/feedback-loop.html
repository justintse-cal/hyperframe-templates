<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          background: #ffffff;
          color: #000000;
          font-family: 'Inter', sans-serif;
          overflow: hidden;
          box-sizing: border-box;
        }

        .frame-border {
          position: absolute;
          inset: 32px;
          border: 1px solid rgba(18, 18, 18, 0.18);
          pointer-events: none;
          z-index: 20;
        }

        .loop-stage {
          position: absolute;
          inset: 160px 224px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .circle-ring {
          position: absolute;
          width: 500px;
          height: 500px;
          border-radius: 50%;
          border: 4px dashed rgba(18, 18, 18, 0.35);
          display: flex;
          align-items: center;
          justify-content: center;
          opacity: 0;
        }

        .loop-center-title {
          font-family: 'Playfair Display', serif;
          font-size: 34px;
          font-weight: 800;
          color: #2274a5;
          text-align: center;
          max-width: 260px;
          line-height: 1.25;
        }

        /* 3 Circular Callout Nodes */
        .stage-callout {
          position: absolute;
          background: rgba(0, 0, 0, 0.04);
          border: 2px solid #c7dce8;
          border-radius: 30px;
          padding: 12px 24px;
          font-size: 21px;
          font-weight: 700;
          color: #000000;
          opacity: 0;
        }

        .node-build {
          top: -30px;
        }

        .node-measure {
          right: -40px;
          top: 320px;
        }

        .node-learn {
          left: -40px;
          top: 320px;
        }

      </style>

      <div data-hf-id="hf-va3g" id="root" data-composition-id="feedback-loop" data-width="1920" data-height="1080" data-duration="8">
        <div data-hf-id="hf-ev3u" class="frame-border"></div>

        <div data-hf-id="hf-7xjv" class="loop-stage">
          <div data-hf-id="hf-wxj7" class="circle-ring" id="c13-ring">
            <div data-hf-id="hf-8mwp" class="loop-center-title">Build-Measure-Learn Loop</div>

            <div data-hf-id="hf-2qop" class="stage-callout node-build" id="c13-build">01. BUILD</div>
            <div data-hf-id="hf-jiju" class="stage-callout node-measure" id="c13-measure">02. MEASURE</div>
            <div data-hf-id="hf-dmkl" class="stage-callout node-learn" id="c13-learn">03. LEARN</div>
          </div>
        </div>

      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // 0–1.2s: Reveal circular graphic & loop name
        tl.fromTo("#c13-ring",
          { opacity: 0, scale: 0.8 },
          { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" },
          0
        );

        // 1.4–4s: Illuminate stages sequentially along circular path
        tl.fromTo("#c13-build", { opacity: 0, y: -15 }, { opacity: 1, y: 0, duration: 0.8 }, 1.4);
        tl.fromTo("#c13-measure", { opacity: 0, x: 15 }, { opacity: 1, x: 0, duration: 0.8 }, 2.4);
        tl.fromTo("#c13-learn", { opacity: 0, x: -15 }, { opacity: 1, x: 0, duration: 0.8 }, 3.4);

        // 4.8–7s: Rotate loop ring slightly & settle on logo
        tl.to("#c13-ring",
          { rotation: 360, duration: 2.2, ease: "power2.inOut" },
          4.8
        );

        window.__timelines["feedback-loop"] = tl;
      </script>
    </template>
  </body>
</html>
