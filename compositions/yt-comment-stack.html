<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          background: #ffffff;
          color: #000000;
          font-family: 'Inter', sans-serif;
          overflow: hidden;
          box-sizing: border-box;
        }

        .frame-border {
          position: absolute;
          inset: 32px;
          border: 1px solid rgba(18, 18, 18, 0.18);
          pointer-events: none;
          z-index: 20;
        }

        #yt-cc-col {
          position: absolute;
          display: flex;
          flex-direction: column;
          gap: 40px;
        }

        .yt-cc-card {
          display: flex;
          gap: 22px;
          align-items: flex-start;
        }

        .yt-cc-avatar {
          flex: none;
          width: 64px;
          height: 64px;
          border-radius: 50%;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 700;
          font-size: 26px;
          color: #000000;
          box-shadow: 0 4px 14px rgba(18, 18, 18, 0.18);
        }

        .yt-cc-meta {
          display: flex;
          align-items: baseline;
          gap: 14px;
        }

        .yt-cc-user {
          font-weight: 700;
          font-size: 27px;
          color: #000000;
        }

        .yt-cc-time {
          font-weight: 400;
          font-size: 23px;
          color: rgba(18, 18, 18, 0.72);
        }

        .yt-cc-text {
          margin-top: 8px;
          font-weight: 500;
          font-size: 34px;
          line-height: 1.35;
          letter-spacing: -0.01em;
          max-width: 860px;
          color: #000000;
        }

        .yt-cc-text .ch {
          opacity: 0;
        }

        .yt-cc-row {
          margin-top: 12px;
          display: flex;
          align-items: center;
          gap: 10px;
          font-weight: 600;
          font-size: 22px;
          color: rgba(18, 18, 18, 0.72);
          opacity: 0;
        }

        .yt-cc-row svg {
          width: 24px;
          stroke-width: 2.4;
          stroke-linecap: round;
          stroke-linejoin: round;
          fill: none;
        }

        .yt-cc-row svg path {
          stroke: rgba(18, 18, 18, 0.72);
        }

        .yt-cc-reply {
          margin-left: 18px;
          letter-spacing: 0.1em;
        }
      </style>

      <div data-hf-id="hf-e09a" id="root" data-composition-id="yt-comment-stack" data-width="1920" data-height="1080" data-duration="8">
        <div data-hf-id="hf-e09f" class="frame-border"></div>

        <div data-hf-id="hf-e09c" id="yt-cc-col"></div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- published parameters ----
             Social comments typing on over the warm editorial board —
             creator-style comment cards. avatar: image path, or null ->
             initials chip in a brand accent gradient.
             Entrance-only (design.md §5): holds until the clip ends. */
          var CONFIG = {
            comments: [
              {
                avatar: null,
                initials: "PW",
                accent: 0, // 0 = gold chip, 1 = pink chip
                username: "@pixelwaves",
                time: "2 days ago",
                text: "Your videos are the best!",
                likes: 47,
              },
              {
                avatar: null,
                initials: "FR",
                accent: 1,
                username: "@framerate",
                time: "1 day ago",
                text: "That camera move at 0:12 though 🔥",
                likes: 12,
              },
            ],
            x: 380,
            y: null, // null = vertically centered
            typeCharDelay: 0.024, // s per character (capped so a comment types <= 2.2s)
          };

          /* Design-system accent chips: gold & pink gradients */
          var ACCENTS = [
            "linear-gradient(135deg, #88d18a, #88d18a)",
            "linear-gradient(135deg, #00513c, #9C1349)",
          ];

          var col = document.getElementById("yt-cc-col");

          var THUMB =
            '<svg viewBox="0 0 24 24"><path d="M7 11v9M7 11l3.2-6.4a2 2 0 0 1 3.6 1.2V9h4.6a2 2 0 0 1 2 2.4l-1.2 6a2 2 0 0 1-2 1.6H7M7 11H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h3"/></svg>';

          /* build cards */
          CONFIG.comments.forEach(function (c, i) {
            var card = document.createElement("div");
            card.className = "yt-cc-card";
            card.id = "yt-cc-card-" + i;

            var av = document.createElement("div");
            av.className = "yt-cc-avatar";
            av.id = "yt-cc-av-" + i;
            if (c.avatar) {
              var img = document.createElement("img");
              img.src = c.avatar;
              av.appendChild(img);
            } else {
              av.textContent = c.initials || "?";
              av.style.background = ACCENTS[c.accent || 0];
            }
            card.appendChild(av);

            var body = document.createElement("div");
            var meta = document.createElement("div");
            meta.className = "yt-cc-meta";
            meta.id = "yt-cc-meta-" + i;
            var user = document.createElement("span");
            user.className = "yt-cc-user";
            user.textContent = c.username;
            var time = document.createElement("span");
            time.className = "yt-cc-time";
            time.textContent = c.time || "";
            meta.appendChild(user);
            meta.appendChild(time);
            body.appendChild(meta);

            var text = document.createElement("div");
            text.className = "yt-cc-text";
            text.id = "yt-cc-text-" + i;
            Array.from(c.text).forEach(function (ch) {
              var span = document.createElement("span");
              span.className = "ch";
              span.textContent = ch;
              text.appendChild(span);
            });
            body.appendChild(text);

            var row = document.createElement("div");
            row.className = "yt-cc-row";
            row.id = "yt-cc-row-" + i;
            row.innerHTML =
              THUMB + "<span>" + (c.likes || 0) + '</span><span class="yt-cc-reply">REPLY</span>';
            body.appendChild(row);
            card.appendChild(body);
            col.appendChild(card);
          });

          /* position (measure after building) */
          col.style.left = CONFIG.x + "px";
          var rect = col.getBoundingClientRect();
          col.style.top =
            (CONFIG.y === null ? Math.round((1080 - rect.height) / 2) : CONFIG.y) + "px";

          var tl = gsap.timeline({ paused: true });

          /* comments enter sequentially: avatar pops, meta fades, text types, row fades */
          var t = 0.3;
          CONFIG.comments.forEach(function (c, i) {
            var av = "#yt-cc-av-" + i,
              meta = "#yt-cc-meta-" + i,
              row = "#yt-cc-row-" + i;
            var chars = document.querySelectorAll("#yt-cc-text-" + i + " .ch");
            var delay = Math.min(CONFIG.typeCharDelay, 2.2 / Math.max(1, chars.length));

            tl.fromTo(av,
              { opacity: 0, scale: 0.5 },
              { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" },
              t
            );
            tl.fromTo(meta,
              { opacity: 0, y: 10 },
              { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
              t + 0.12
            );
            t += 0.4;
            tl.to(chars, { opacity: 1, duration: 0.02, stagger: delay, ease: "none" }, t);
            t += chars.length * delay + 0.15;
            tl.to(row, { opacity: 1, duration: 0.35, ease: "power2.out" }, t);
            t += 0.5;
          });
          /* last beat settles ~4s; the frame holds to the clip end at 8s */

          window.__timelines["yt-comment-stack"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
