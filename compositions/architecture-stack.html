          justify-content: space-between;
          padding: 0 40px;

          background: rgba(255, 243, 168, 0.6);
          border: 2px solid #fa003f;
          box-shadow: 0 0 30px rgba(138, 109, 0, 0.15);

        .layer-tag {

          font-size: 23px;
          font-style: italic;
          color: #fa003f;
        }
