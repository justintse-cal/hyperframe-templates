<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap');

        *, *::before, *::after { box-sizing: border-box; }

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          isolation: isolate;
          background: #ffffff;
          color: #fe4a49;
          font-family: 'Plus Jakarta Sans', sans-serif;
          pointer-events: none;
        }

        .frame-border {
          position: absolute;
          inset: 32px;
          border: 1px solid rgba(18, 18, 18, 0.18);
          pointer-events: none;
          z-index: 20;
        }

        .gca-clip {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
          overflow: hidden;
        }

        .gca-stage {
          display: grid;
          width: var(--gca-stage-w, 80cqw);
          grid-auto-rows: var(--gca-row-h, 34cqh);
          gap: 2.4cqmin;
          will-change: transform, opacity;
        }

        .gca-card {
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          min-width: 0;
          min-height: 0;
          padding: var(--gca-pad, 4cqh);
          overflow: hidden;
          border: 1px solid rgba(18, 18, 18, 0.16);
          border-radius: 1.8cqmin;
          background:
            linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.7) 60%),
            rgba(255, 255, 255, 0.78);
          box-shadow: 0 1.4cqh 3.6cqh rgba(18, 18, 18, 0.08);
          will-change: transform, opacity;
        }

        .gca-icon {
          flex: 0 0 auto;
          font-family: 'Material Symbols Outlined';
          font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 48;
          font-size: var(--gca-icon, 7cqh);
          line-height: 1;
          color: var(--gca-accent, #fa003f);
          font-weight: normal;
          font-style: normal;
          letter-spacing: normal;
          text-transform: none;
          white-space: nowrap;
          word-wrap: normal;
          direction: ltr;
          -webkit-font-feature-settings: 'liga';
          -webkit-font-smoothing: antialiased;
        }

        .gca-text { min-width: 0; }

        .gca-label {
          overflow: hidden;
          color: #fe4a49;
          font-size: var(--gca-font, 2.2cqh);
          font-weight: 700;
          line-height: 1.25;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          white-space: nowrap;
        }

        .gca-body {
          margin-top: var(--gca-body-gap, 1.1cqh);
          overflow: hidden;
          color: rgba(18, 18, 18, 0.68);
          font-size: var(--gca-body-font, 2.6cqh);
          font-weight: 400;
          line-height: 1.4;
          letter-spacing: 0.01em;
          white-space: nowrap;
        }

        .gca-stage[data-layout="list"] .gca-card {
          flex-direction: row;
          align-items: center;
          justify-content: flex-start;
          gap: 2.4cqmin;
        }

        .gca-stage[data-layout="list"] .gca-body {
          margin-top: var(--gca-body-gap, 0.6cqh);
        }
      </style>

      <div data-hf-id="hf-c08a" id="root" data-composition-id="C08-grid-card-assemble" data-width="1920" data-height="1080" data-duration="8">
        <div data-hf-id="hf-c08f" class="frame-border"></div>

        <div data-hf-id="hf-c08c" id="c08-clip" class="gca-clip clip" data-start="0" data-duration="8" data-track-index="0">
          <div data-hf-id="hf-6oyf" class="gca-stage" data-slot="items" role="list"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- published parameters ----
             Capability cards stagger-assemble into a grid, each icon fading
             in as its card lands. Once the layout resolves the frame holds
             perfectly still. Entrance-only. */
          var CONFIG = {
            items: [
              { label: 'Capture', body: 'Record once, anywhere' },
              { label: 'Compose', body: 'Cut on the beat grid' },
              { label: 'Render', body: 'Export in minutes' },
              { label: 'Publish', body: 'Ship to every channel' },
            ],
            layout: 'grid',
            // Material Symbols ligature names, cycled by card index.
            icons: ['videocam', 'movie_edit', 'bolt', 'rocket_launch'],
            accent: '#fa003f',
          };

          var root = document.getElementById('root');
          var stage = root.querySelector('.gca-stage');

          var entries = CONFIG.items;
          var layout = CONFIG.layout === 'list' ? 'list' : 'grid';
          var isList = layout === 'list';
          var exit = 'none'; // entrance-only

          root.style.setProperty('--gca-accent', CONFIG.accent);

          var cards = entries.map(function (entry, index) {
            var card = document.createElement('div');
            card.className = 'gca-card';
            card.setAttribute('role', 'listitem');

            var icon = document.createElement('span');
            icon.className = 'gca-icon material-symbols-outlined';
            icon.setAttribute('aria-hidden', 'true');
            icon.textContent = CONFIG.icons[index % CONFIG.icons.length];
            card.appendChild(icon);

            var text = document.createElement('div');
            text.className = 'gca-text';
            var label = document.createElement('div');
            label.className = 'gca-label';
            label.textContent = entry.label;
            text.appendChild(label);
            if (entry.body) {
              var body = document.createElement('div');
              body.className = 'gca-body';
              body.textContent = entry.body;
              text.appendChild(body);
            }
            card.appendChild(text);
            stage.appendChild(card);
            return card;
          });
          var count = cards.length;
          stage.setAttribute('data-layout', layout);
          stage.setAttribute(
            'aria-label',
            entries.map(function (entry) { return entry.label; }).join(', '),
          );

          /* Layout geometry: 4 items form a 2x2 grid. */
          var autoColumns = count <= 3 ? count : Math.ceil(Math.sqrt(count));
          var columns = layout === 'list' ? 1 : Math.max(1, Math.min(4, autoColumns));
          var rows = Math.ceil(count / columns);
          stage.style.gridTemplateColumns = 'repeat(' + columns + ', minmax(0, 1fr))';

          var hasBodies = entries.some(function (entry) { return !!entry.body; });

          /* Vertical budget: ~72cqh split across rows, capped so cards stay
             proportioned. Stays above the y=920 safe band via place-items. */
          var stageW = isList ? 64 : 78;
          var rowCap = isList ? 15 : hasBodies ? 30 : 24;
          var rowH = Math.max(6, Math.min(rowCap, (72 - 3 * (rows - 1)) / rows));
          root.style.setProperty('--gca-stage-w', stageW + 'cqw');
          root.style.setProperty('--gca-row-h', rowH.toFixed(3) + 'cqh');

          var pad = rowH * (isList ? 0.16 : 0.12);
          var iconSize = isList ? rowH * 0.42 : Math.min(rowH * 0.3, 9);
          root.style.setProperty('--gca-pad', pad.toFixed(3) + 'cqh');
          root.style.setProperty('--gca-icon', iconSize.toFixed(3) + 'cqh');
          root.style.setProperty('--gca-body-gap', (rowH * (isList ? 0.03 : 0.035)).toFixed(3) + 'cqh');

          /* Deterministic text fitting: label ~0.72em/glyph, body ~0.52em. */
          var maxChars = entries.reduce(function (max, entry) {
            return Math.max(max, Array.from(entry.label).length);
          }, 1);
          var maxBody = entries.reduce(function (max, entry) {
            return Math.max(max, Array.from(entry.body || '').length);
          }, 0);
          var cellW = stageW / columns;
          var textW = isList ? cellW * 0.62 : cellW * 0.78;
          var labelCqw = Math.min(2.6, textW / (maxChars * 0.72));
          var labelCqh = rowH * (isList ? 0.23 : 0.11);
          root.style.setProperty('--gca-font', 'min(' + labelCqw.toFixed(3) + 'cqw, ' + labelCqh.toFixed(3) + 'cqh)');
          if (maxBody > 0) {
            var bodyCqw = Math.min(2.2, textW / (maxBody * 0.52));
            var bodyCqh = rowH * (isList ? 0.19 : 0.12);
            root.style.setProperty('--gca-body-font', 'min(' + bodyCqw.toFixed(3) + 'cqw, ' + bodyCqh.toFixed(3) + 'cqh)');
          }

          /* RETIME RANGE: fixed IN cascade, elastic still HOLD. The last card
             lands near 60% of the authored duration, so the assembly occupies
             the shot rather than finishing in the first quarter. */
          var BASE_START = 0.15;
          var GAP = 0.1;
          var TILE_BASE = 0.65;
          var duration = 8;
          var OUT = 0;
          var avail = duration - OUT;
          var TILE = Math.min(TILE_BASE, Math.max(0.2, avail - BASE_START));
          var latestStart = Math.max(0, avail - TILE);
          var firstStart = Math.min(BASE_START, latestStart);
          var targetLastStart = Math.min(
            latestStart,
            Math.max(0.6 * duration - TILE, BASE_START + GAP * (count - 1)),
          );
          var gap = count > 1 ? Math.max(0, targetLastStart - firstStart) / (count - 1) : 0;
          var starts = cards.map(function (card, index) {
            return Math.max(0, Math.min(firstStart + gap * index, latestStart));
          });

          var tl = gsap.timeline({ paused: true });

          /* IN: fade + short slide directly into the slot, long-tail settle,
             no overshoot. Explicit both-endpoints state so any seek is exact. */
          cards.forEach(function (card, index) {
            gsap.set(card, { opacity: 0, y: '3cqh' });
            tl.fromTo(
              card,
              { opacity: 0, y: '3cqh' },
              { opacity: 1, y: '0cqh', duration: TILE, ease: 'power3.out' },
              starts[index],
            );
            var icon = card.querySelector('.gca-icon');
            gsap.set(icon, { opacity: 0, scale: 0.8 });
            tl.fromTo(
              icon,
              { opacity: 0, scale: 0.8 },
              { opacity: 1, scale: 1, duration: TILE * 0.55, ease: 'power2.out' },
              starts[index] + TILE * 0.3,
            );
          });

          /* HOLD: intentionally still. Nothing floats, nothing pushes in. */

          tl.seek(0);
          window.__timelines['C08-grid-card-assemble'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
