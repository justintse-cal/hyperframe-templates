      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          const S = '[data-composition-id="C11-flowchart"]';
          const tl = gsap.timeline({ paused: true });

          /* 1. Root node scales in */
          tl.fromTo(S + " #node-root", { scale: 0 }, { scale: 1, duration: 0.4, ease: "power2.out" }, 0);

          /* 2. Connectors draw, then their labels */
          tl.to(
            S + " .connector#path-1-L, " + S + " .connector#path-1-R",
            { strokeDashoffset: 0, duration: 0.5, ease: "none" },
            1,
          );
          tl.to(S + " #label-yes, " + S + " #label-not-sure", { opacity: 1, duration: 0.2 }, 1.25);

          /* 3. Level 2 nodes */
          tl.fromTo(S + " #node-yes", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 1.4);
          tl.fromTo(
            S + " #node-not-sure",
            { scale: 0 },
            { scale: 1, duration: 0.4, ease: "back.out(1.7)" },
            1.6,
          );

          /* 4. Level 2 -> 3 connectors */
          tl.to(
            S +
              " .connector#path-2-LL, " +
              S +
              " .connector#path-2-LR, " +
              S +
              " .connector#path-2-RL, " +
              S +
              " .connector#path-2-RR",
            { strokeDashoffset: 0, duration: 0.4, ease: "none" },
            2.5,
          );

          /* 5. Leaf nodes */
          const leafNodes = [
            S + " #node-python",
            S + " #node-nocode",
            S + " #node-website",
            S + " #node-course",
          ];
          leafNodes.forEach((id, i) => {
            tl.fromTo(id, { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 2.8 + i * 0.15);
          });

          /* 6. The finished tree holds to 8s - no cursor, no exit motion */
          window.__timelines["C11-flowchart"] = tl;
        })();
