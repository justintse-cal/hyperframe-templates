<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap');

        /* OS-bundled CJK fonts — declared locally, no network file needed. */
        @font-face { font-family: 'Microsoft JhengHei'; src: local('Microsoft JhengHei'); }
        @font-face { font-family: 'PingFang TC'; src: local('PingFang TC'); }
        @font-face { font-family: 'Noto Sans TC'; src: local('Noto Sans TC'); }

        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: linear-gradient(135deg, #FFFCEF 0%, #FDF3F8 100%);
          color: #121212;
          font-family: 'Plus Jakarta Sans', sans-serif;
          pointer-events: none;
          box-sizing: border-box;
          isolation: isolate;
        }

        /* Soft warm halo behind the card so the pill lifts off the gradient. */
        .e15-halo {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 1040px;
          height: 420px;
          margin-left: -520px;
          margin-top: -210px;
          z-index: 0;
          opacity: 0;
          background: radial-gradient(
            ellipse at center,
            rgba(194, 24, 91, 0.14) 0%,
            rgba(255, 227, 79, 0.07) 46%,
            rgba(255, 255, 255, 0) 74%
          );
        }

        .e15-stage {
          position: absolute;
          inset: 0;
          z-index: 10;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .e15-pill {
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 18px 22px 18px 18px;
          border-radius: 999px;
          background:
            linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.12)),
            linear-gradient(135deg, #FFFCEF 0%, #FDF3F8 100%);
          border: 1px solid rgba(18, 18, 18, 0.10);
          box-shadow:
            0 26px 70px rgba(138, 109, 0, 0.18),
            0 8px 20px rgba(18, 18, 18, 0.10),
            inset 0 1px 0 rgba(255, 255, 255, 0.90);
          opacity: 0;
          will-change: transform, opacity;
        }

        .e15-item {
          opacity: 0;
        }

        .e15-brand {
          display: flex;
          align-items: center;
          gap: 14px;
          padding-right: 2px;
        }

        .e15-avatar {
          display: block;
          width: 72px;
          height: 72px;
          flex: none;
          border-radius: 50%;
          object-fit: cover;
          border: 2px solid rgba(255, 255, 255, 0.92);
          box-shadow: 0 6px 16px rgba(18, 18, 18, 0.18);
          background: #FFF3A8;
        }

        .e15-name {
          font-size: 34px;
          font-weight: 700;
          line-height: 1;
          letter-spacing: -0.015em;
          color: #121212;
          white-space: nowrap;
        }

        .e15-divider {
          width: 1px;
          height: 40px;
          flex: none;
          background: rgba(18, 18, 18, 0.14);
        }

        .e15-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          height: 56px;
          flex: none;
          border: 0;
          border-radius: 999px;
          white-space: nowrap;
          font-family: 'Plus Jakarta Sans', sans-serif;
          font-size: 23px;
          font-weight: 600;
          line-height: 1;
          padding: 0 18px;
          color: #121212;
          background: rgba(255, 255, 255, 0.46);
          box-shadow: inset 0 0 0 1px rgba(18, 18, 18, 0.12);
          will-change: transform;
        }

        .e15-sub {
          height: 58px;
          padding: 0 27px;
          font-family: 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
          font-size: 27px;
          font-weight: 700;
          letter-spacing: 0.02em;
          color: #FFFFFF;
          background: #C2185B;
          box-shadow: 0 8px 20px rgba(194, 24, 91, 0.28);
        }

        .e15-icon {
          font-family: 'Material Symbols Outlined';
          font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 48;
          font-size: 26px;
          line-height: 1;
          font-weight: normal;
          font-style: normal;
          letter-spacing: normal;
          text-transform: none;
          white-space: nowrap;
          word-wrap: normal;
          direction: ltr;
          -webkit-font-feature-settings: 'liga';
          -webkit-font-smoothing: antialiased;
          color: #121212;
        }

        /* The reply glyph points left by default; mirror it so Share reads forward. */
        .e15-icon-mirror {
          display: inline-block;
          transform: scaleX(-1);
        }

        /* Cursor + click ripples sit above the card. */
        .e15-fx {
          position: absolute;
          inset: 0;
          z-index: 30;
          pointer-events: none;
        }

        .e15-cursor {
          position: absolute;
          left: 0;
          top: 0;
          width: 34px;
          height: 40px;
          z-index: 2;
          transform-origin: 2.2px 1.6px;
          filter: drop-shadow(0 7px 10px rgba(18, 18, 18, 0.28));
          will-change: transform;
        }

        .e15-ripple {
          position: absolute;
          width: 68px;
          height: 68px;
          z-index: 1;
          border-radius: 50%;
          border: 2px solid #C2185B;
          opacity: 0;
          will-change: transform, opacity;
        }

        .e15-ripple-light {
          border-color: #FFFFFF;
          box-shadow: 0 0 0 1px rgba(194, 24, 91, 0.28);
        }
      </style>

      <div
        data-hf-id="hf-e15r"
        id="root"
        data-composition-id="E15-subscribe-outro"
        data-width="1920"
        data-height="1080"
        data-duration="8"
      >
        <div data-hf-id="hf-e15h" class="e15-halo" id="e15-halo"></div>

        <div data-hf-id="hf-e15s" class="e15-stage">
          <div data-hf-id="hf-e15p" class="e15-pill" id="e15-pill">
            <div class="e15-brand e15-item" id="e15-brand">
              <img
                data-hf-id="hf-e15a"
                class="e15-avatar"
                id="e15-avatar"
                src="../stock%20media/web_dev.jpg"
                alt=""
                width="144"
                height="144"
              />
              <div class="e15-name">Trial Tech</div>
            </div>

            <div class="e15-divider e15-item" id="e15-divider"></div>

            <button class="e15-btn e15-sub e15-item" id="e15-sub" type="button">訂閱</button>

            <button class="e15-btn e15-item" id="e15-like" type="button">
              <span class="e15-icon material-symbols-outlined" aria-hidden="true">thumb_up</span>Like
            </button>

            <button class="e15-btn e15-item" id="e15-share" type="button">
              <span class="e15-icon e15-icon-mirror material-symbols-outlined" aria-hidden="true">reply</span>Share
            </button>
          </div>
        </div>

        <div data-hf-id="hf-e15f" class="e15-fx" id="e15-fx">
          <div data-hf-id="hf-e15c" class="e15-cursor" id="e15-cursor" aria-hidden="true">
            <svg viewBox="0 0 26 30" width="34" height="40">
              <path
                d="M2.2 1.6 L2.2 24.6 L8.1 19.4 L11.7 27.5 L15.3 25.9 L11.8 17.9 L19.8 17.9 Z"
                fill="#FFFCEF"
                stroke="#121212"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- published parameters ----
             An end-card subscribe pill: channel identity on the left,
             Subscribe / Like / Share actions on the right. A cursor
             demonstrates each action, leaves the frame, and returns.
             The placeholder channel icon is stock media/web_dev.jpg —
             swap the <img src> above when the real icon is ready.
             Entrance-only for the card (design.md §5); the cursor's
             repeated approach / retreat is the requested interaction loop. */

          var TIP_X = 2.2;
          var TIP_Y = 1.6;
          var RIPPLE_R = 34;
          var MOVE_DUR = 0.8;

          var root = document.getElementById("root");
          var pill = document.getElementById("e15-pill");
          var halo = document.getElementById("e15-halo");
          var cursor = document.getElementById("e15-cursor");
          var fx = document.getElementById("e15-fx");
          var items = gsap.utils.toArray(".e15-item");

          function centerOf(el) {
            var r = el.getBoundingClientRect();
            var rootRect = root.getBoundingClientRect();
            return {
              x: r.left - rootRect.left + r.width / 2,
              y: r.top - rootRect.top + r.height / 2,
            };
          }

          function addRipple(target, light) {
            var c = centerOf(target);
            var ripple = document.createElement("div");
            ripple.className = "e15-ripple" + (light ? " e15-ripple-light" : "");
            ripple.style.left = c.x - RIPPLE_R + "px";
            ripple.style.top = c.y - RIPPLE_R + "px";
            fx.appendChild(ripple);
            return { el: ripple, center: c };
          }

          function build() {
            var tl = gsap.timeline({ paused: true });

            var targets = [
              {
                el: document.getElementById("e15-sub"),
                light: true,
                from: { x: 1996, y: 944 },
                exit: { x: 1996, y: 604 },
                enter: 0.95,
              },
              {
                el: document.getElementById("e15-like"),
                light: false,
                from: { x: -72, y: 932 },
                exit: { x: -72, y: 700 },
                enter: 2.90,
              },
              {
                el: document.getElementById("e15-share"),
                light: false,
                from: { x: 1972, y: 118 },
                exit: { x: 1972, y: 258 },
                enter: 4.85,
              },
            ];

            var ripples = targets.map(function (t) {
              return addRipple(t.el, t.light);
            });

            /* card entrance */
            tl.fromTo(
              halo,
              { opacity: 0 },
              { opacity: 1, duration: 0.7, ease: "power2.out" },
              0.0
            );
            tl.fromTo(
              pill,
              { opacity: 0, y: 32, scale: 0.94 },
              { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.3)" },
              0.05
            );
            tl.fromTo(
              items,
              { opacity: 0, y: 10 },
              { opacity: 1, y: 0, duration: 0.4, stagger: 0.07, ease: "power2.out" },
              0.14
            );

            /* cursor starts off-frame and all ripples are primed invisible */
            tl.set(cursor, { x: 1996, y: 944, scale: 1 }, 0);
            tl.set(
              ripples.map(function (r) { return r.el; }),
              { scale: 0, opacity: 0 },
              0
            );

            /* three passes: Subscribe → Like → Share */
            targets.forEach(function (t, i) {
              var ripple = ripples[i];
              var tx = ripple.center.x - TIP_X;
              var ty = ripple.center.y - TIP_Y;
              var clickAt = t.enter + MOVE_DUR + 0.04;

              tl.set(cursor, { x: t.from.x, y: t.from.y, scale: 1 }, t.enter - 0.02);
              tl.to(
                cursor,
                { x: tx, y: ty, duration: MOVE_DUR, ease: "power3.out" },
                t.enter
              );

              /* click: cursor + target compress together */
              tl.to(
                cursor,
                { scale: 0.80, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 },
                clickAt
              );
              tl.to(
                t.el,
                { scale: 0.95, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 },
                clickAt
              );

              /* expanding ring from the click point */
              tl.set(ripple.el, { scale: 0.35, opacity: 0.7 }, clickAt + 0.02);
              tl.to(
                ripple.el,
                { scale: 2.3, opacity: 0, duration: 0.62, ease: "power2.out" },
                clickAt + 0.02
              );

              /* retreat off-frame */
              tl.to(
                cursor,
                { x: t.exit.x, y: t.exit.y, duration: 0.4, ease: "power2.in" },
                clickAt + 0.3
              );
            });

            /* last beat settles at ~6.4s; the card holds to the 8s clip end */
            window.__timelines["E15-subscribe-outro"] = tl;
          }

          /* Wait for the icon + CJK fonts so the button centres used for the
             click targets are measured against the settled layout. */
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(build);
          } else {
            build();
          }
        })();
      </script>
    </template>
  </body>
</html>
