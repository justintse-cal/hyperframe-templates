<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          background: #ffffff;
          color: #000000;
          font-family: 'Plus Jakarta Sans', sans-serif;
          overflow: hidden;
          box-sizing: border-box;
          isolation: isolate;
        }

        .frame-border {
          position: absolute;
          inset: 32px;
          border: 1px solid rgba(18, 18, 18, 0.18);
          pointer-events: none;
          z-index: 20;
        }

        /* ----------------------------------------------------- typed prompt */
        .tp-clip {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
          overflow: hidden;
        }

        .tp-stage {
          width: 1340px;
          will-change: transform, opacity;
        }

        .tp-shell {
          display: flex;
          align-items: flex-start;
          gap: 28px;
          min-height: 250px;
          padding: 56px 62px;
          border: 1px solid rgba(18, 18, 18, 0.16);
          border-radius: 22px;
          background: rgba(255, 255, 255, 0.76);
          box-shadow: 0 26px 64px rgba(18, 18, 18, 0.12);
        }

        .tp-glyph {
          flex: 0 0 auto;
          color: #c7dce8;
          font-size: var(--tp-font-size, 40px);
          font-weight: 700;
          line-height: 1.45;
        }

        .tp-line {
          flex: 1 1 auto;
          min-width: 0;
          color: #000000;
          font-size: var(--tp-font-size, 40px);
          font-weight: 600;
          line-height: 1.45;
          letter-spacing: -0.01em;
          overflow-wrap: anywhere;
          white-space: pre-wrap;
        }

        .tp-caret {
          display: inline-block;
          width: 0.5ch;
          height: 1.05em;
          margin-left: 0.08ch;
          background: #c7dce8;
          vertical-align: text-bottom;
          will-change: opacity;
        }
      </style>

      <div data-hf-id="hf-e12a" id="root" data-composition-id="typed-prompt" data-width="1920" data-height="1080" data-duration="8">
        <div data-hf-id="hf-e12f" class="frame-border"></div>

        <div data-hf-id="hf-e12c" id="e12-clip" class="tp-clip clip" data-start="0" data-duration="8" data-track-index="0">
          <div data-hf-id="hf-1z4v" class="tp-stage" role="img">
            <div data-hf-id="hf-z7ct" class="tp-shell">
              <span data-hf-id="hf-jsjv" class="tp-glyph" aria-hidden="true">&gt;</span>
              <span data-hf-id="hf-khnx" class="tp-line" aria-hidden="true"><span data-hf-id="hf-rxqr" class="tp-text"></span><span data-hf-id="hf-b99z" class="tp-caret"></span></span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- published parameters ----
             A single prompt line types itself in chunked human cadence behind
             a deterministic blinking caret, then holds. Entrance-only. */
          var CONFIG = {
            text: 'Turn a blog post into a launch video',
            prompt_glyph: '>',
            cadence: 'human',
            caret: 'blink',
          };

          var root = document.getElementById('root');
          var stage = root.querySelector('.tp-stage');
          var glyphElement = root.querySelector('.tp-glyph');
          var textElement = root.querySelector('.tp-text');
          var caretElement = root.querySelector('.tp-caret');

          var text = CONFIG.text;
          var promptGlyph = CONFIG.prompt_glyph;
          var cadence = CONFIG.cadence;
          var caretMode = CONFIG.caret;

          glyphElement.textContent = promptGlyph;
          if (promptGlyph === '') glyphElement.style.display = 'none';
          stage.setAttribute('aria-label', text);

          var ENTER = 0.5;
          var TYPE_START = 0.45;
          var STILLNESS = 0.3;
          var duration = 8;
          var OUT = 0; // entrance-only: no departure

          // Fixed-seed LCG: the only randomness source, consumed in one
          // deterministic order during this synchronous build.
          var lcgState = 0x7f4a7c15;
          function rnd() {
            lcgState = (Math.imul(1664525, lcgState) + 1013904223) >>> 0;
            return lcgState / 4294967296;
          }
          function chunksOf(word) {
            if (cadence === 'uniform') return Array.from(word);
            var out = [];
            var i = 0;
            while (i < word.length) {
              var n = 1 + Math.floor(rnd() * 3);
              out.push(word.slice(i, i + n));
              i += n;
            }
            return out;
          }
          function chunkGap(chunk) {
            if (cadence === 'uniform') return chunk.length * 0.055;
            return chunk.length * (0.05 + rnd() * 0.04);
          }

          // The complete text-at-time table. Built exactly once; the timeline
          // only ever reads it, so seeks in any direction resolve the same
          // string for the same time.
          var rows = [{ t: 0, x: '' }];
          var words = text.split(/\s+/).filter(function (word) {
            return word.length > 0;
          });
          (function buildRows() {
            var t = TYPE_START;
            var acc = '';
            words.forEach(function (word, wordIndex) {
              if (wordIndex > 0) acc += ' ';
              if (wordIndex > 0) t += cadence === 'uniform' ? 0.11 : 0.1 + rnd() * 0.1;
              chunksOf(word).forEach(function (chunk) {
                t += chunkGap(chunk);
                acc += chunk;
                rows.push({ t: t, x: acc });
              });
            });
          })();

          // Compress typing proportionally only if it would overflow the
          // window; extra duration becomes HOLD, never timeScale.
          var naturalEnd = rows[rows.length - 1].t;
          var maxEnd = Math.max(TYPE_START + 0.2, duration - OUT - STILLNESS);
          if (naturalEnd > maxEnd) {
            var factor = (maxEnd - TYPE_START) / (naturalEnd - TYPE_START);
            rows.forEach(function (row) {
              if (row.t > TYPE_START) row.t = TYPE_START + (row.t - TYPE_START) * factor;
            });
          }
          var typeEnd = Math.max(rows[rows.length - 1].t, TYPE_START + 0.01);

          // 1ms tolerance: GSAP snaps a tween's end value below the row
          // table's accumulated float times, and 1ms is far under one frame.
          function textAt(time) {
            for (var i = rows.length - 1; i >= 0; i -= 1) {
              if (time >= rows[i].t - 0.001) return rows[i].x;
            }
            return '';
          }

          // Fixed type scale for the landscape shell (the component used
          // container queries; here the box is a known 1340px).
          root.style.setProperty('--tp-font-size', '40px');

          gsap.set(stage, { opacity: 0, y: 34 });
          textElement.textContent = '';

          var tl = gsap.timeline({ paused: true });

          // IN: one panel settle, then the table drives every visible frame.
          tl.to(stage, { opacity: 1, duration: ENTER, ease: 'power2.out' }, 0);
          tl.to(stage, { y: 0, duration: ENTER, ease: 'power3.out' }, 0);

          var typeDriver = { t: 0 };
          tl.to(
            typeDriver,
            {
              t: typeEnd,
              duration: typeEnd,
              ease: 'none',
              onUpdate: function () {
                textElement.textContent = textAt(typeDriver.t);
              },
            },
            0,
          );

          // Caret: integer sine cycles across exactly the typing window,
          // then a single pin to solid. Solid mode never blinks.
          if (caretMode === 'blink') {
            var cycles = Math.max(1, Math.round(typeEnd / 0.9));
            var blink = { p: 0 };
            tl.to(
              blink,
              {
                p: Math.PI * 2 * cycles,
                duration: typeEnd,
                ease: 'none',
                onUpdate: function () {
                  caretElement.style.opacity = Math.sin(blink.p) >= 0 ? '1' : '0';
                },
              },
              0,
            );
            tl.set(caretElement, { opacity: 1 }, typeEnd);
          }

          // HOLD: barely-there drift ending at exactly zero, then stillness.
          var OUT_START = duration - OUT;
          var holdSpan = OUT_START - typeEnd;
          if (holdSpan > 0.9) {
            var driftHalf = (holdSpan - STILLNESS) / 2;
            tl.to(stage, { y: -6, duration: driftHalf, ease: 'sine.inOut' }, typeEnd);
            tl.to(stage, { y: 0, duration: driftHalf, ease: 'sine.inOut' }, typeEnd + driftHalf);
          }

          tl.seek(0);
          window.__timelines['typed-prompt'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
