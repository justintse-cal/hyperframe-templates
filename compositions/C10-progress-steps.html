<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; }

        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: linear-gradient(135deg, #FFFCEF 0%, #FDF3F8 100%);
          color: #121212;
          font-family: 'Plus Jakarta Sans', sans-serif;
          pointer-events: none;
          isolation: isolate;
        }

        /* The stage ends at y = 920 so the subtitle band stays empty. */
        .c10-stage {
          position: absolute;
          inset: 0 0 160px 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 88px;
        }

        .c10-title {
          margin: 0;
          font-family: 'Playfair Display', serif;
          font-size: 58px;
          font-weight: 800;
          line-height: 1.15;
          letter-spacing: -0.02em;
          color: #8A6D00;
          text-align: center;
          will-change: transform, opacity;
        }

        .c10-stepper {
          display: flex;
          align-items: flex-start;
          justify-content: center;
        }

        .c10-step {
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 96px;
        }

        /* Inactive: a thin ink ring. Reached: gold ring over a gold→pink disc. */
        .c10-ring {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 96px;
          height: 96px;
          border: 5px solid rgba(18, 18, 18, 0.25);
          border-radius: 50%;
          will-change: transform;
        }

        .c10-disc {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          background: linear-gradient(135deg, #8A6D00 0%, #C2185B 100%);
          transform: scale(0);
          will-change: transform;
        }

        .c10-num {
          position: relative;
          z-index: 1;
          color: rgba(18, 18, 18, 0.5);
          font-size: 34px;
          font-weight: 600;
          line-height: 1;
        }

        .c10-label {
          margin-top: 20px;
          color: rgba(18, 18, 18, 0.5);
          font-size: 28px;
          font-weight: 600;
          line-height: 1.3;
          white-space: nowrap;
        }

        /* Aligns the 4px connector to the 96px ring's vertical centre. */
        .c10-connector {
          width: 210px;
          height: 4px;
          margin-top: 46px;
          border-radius: 2px;
          background: rgba(18, 18, 18, 0.12);
          overflow: hidden;
        }

        .c10-connector-fill {
          width: 100%;
          height: 100%;
          border-radius: 2px;
          background: linear-gradient(90deg, #8A6D00 0%, #C2185B 100%);
          transform: scaleX(0);
          transform-origin: left center;
          will-change: transform;
        }
      </style>

      <div
        id="root"
        data-composition-id="C10-progress-steps"
        data-width="1920"
        data-height="1080"
        data-duration="8"
      >
        <div class="c10-stage">
          <h2 class="c10-title" id="c10-title">Project Timeline</h2>

          <div class="c10-stepper">
            <div class="c10-step">
              <div class="c10-ring" id="c10-ring-1">
                <span class="c10-disc" id="c10-disc-1" aria-hidden="true"></span>
                <span class="c10-num" id="c10-num-1">1</span>
              </div>
              <span class="c10-label" id="c10-label-1">Research</span>
            </div>

            <div class="c10-connector" aria-hidden="true">
              <span class="c10-connector-fill" id="c10-fill-1"></span>
            </div>

            <div class="c10-step">
              <div class="c10-ring" id="c10-ring-2">
                <span class="c10-disc" id="c10-disc-2" aria-hidden="true"></span>
                <span class="c10-num" id="c10-num-2">2</span>
              </div>
              <span class="c10-label" id="c10-label-2">Design</span>
            </div>

            <div class="c10-connector" aria-hidden="true">
              <span class="c10-connector-fill" id="c10-fill-2"></span>
            </div>

            <div class="c10-step">
              <div class="c10-ring" id="c10-ring-3">
                <span class="c10-disc" id="c10-disc-3" aria-hidden="true"></span>
                <span class="c10-num" id="c10-num-3">3</span>
              </div>
              <span class="c10-label" id="c10-label-3">Build</span>
            </div>

            <div class="c10-connector" aria-hidden="true">
              <span class="c10-connector-fill" id="c10-fill-3"></span>
            </div>

            <div class="c10-step">
              <div class="c10-ring" id="c10-ring-4">
                <span class="c10-disc" id="c10-disc-4" aria-hidden="true"></span>
                <span class="c10-num" id="c10-num-4">4</span>
              </div>
              <span class="c10-label" id="c10-label-4">Launch</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var STEPS = 4;
          var FIRST = 0.55;   /* title settle ends here */
          var INTERVAL = 1.2; /* one step per 1.2s, last beat lands at 4.5s */
          var FILL = 0.35;
          var PULSE = 0.6;

          var tl = gsap.timeline({ paused: true });

          tl.fromTo(
            "#c10-title",
            { opacity: 0, y: -18 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
            0
          );

          for (var i = 0; i < STEPS; i++) {
            var at = FIRST + i * INTERVAL;
            var n = i + 1;
            var ring = document.getElementById("c10-ring-" + n);
            var disc = document.getElementById("c10-disc-" + n);
            var num = document.getElementById("c10-num-" + n);
            var label = document.getElementById("c10-label-" + n);

            /* The source spring is under-damped (damping ratio around 0.52),
               so back.out gives the same single visible overshoot without the
               ringing that elastic would add at this size. */
            tl.set(ring, { scale: 0.9 }, at);
            tl.to(ring, { scale: 1.1, duration: PULSE, ease: "back.out(2.6)" }, at);

            tl.fromTo(
              disc,
              { scale: 0 },
              { scale: 1, duration: FILL, ease: "power2.out" },
              at
            );
            tl.to(ring, { borderColor: "#8A6D00", duration: FILL, ease: "power1.out" }, at);
            tl.to(num, { color: "#FFFCEF", duration: FILL, ease: "power1.out" }, at);
            tl.to(label, { color: "#121212", duration: FILL, ease: "power1.out" }, at);

            if (i < STEPS - 1) {
              var fill = document.getElementById("c10-fill-" + n);
              tl.fromTo(
                fill,
                { scaleX: 0 },
                { scaleX: 1, duration: INTERVAL / 2, ease: "power2.inOut" },
                at + INTERVAL / 2
              );
            }
          }

          window.__timelines = window.__timelines || {};
          window.__timelines["C10-progress-steps"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
