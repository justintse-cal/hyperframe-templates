<!doctype html>

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
        font-family: 'Inter', sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Sub-comp slots stretch to fill root */
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
